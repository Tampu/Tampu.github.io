# Field Notes: the small, list-like parts of the page.
# Long entries (hikes, midnight thoughts) live as Markdown files in _field_notes/.
#
# Photos: drop the file in assets/field-notes/lens/ and put its name in `file:`.
# An empty `file:` shows a taped placeholder instead. `ratio` is width / height of the frame.

sections:
