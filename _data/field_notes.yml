remember:
  quotes:
    - text: "You could never convince a monkey to give you a banana by promising him limitless bananas after death in monkey heaven."
      source: "Yuval Noah Harari, Sapiens"
    - text: "The mind is restless, turbulent, obstinate and very strong, O Krishna, and to subdue it, I think, is more difficult than controlling the wind."
      source: "Arjuna, Bhagavad Gita 6.34"
    - text: "Whatever will be, will be."
      source: "Que Sera, Sera (Livingston & Evans), sung by Doris Day"
  books:
    - title: Sapiens
      by: Yuval Noah Harari
    - title: The Palace of Illusions
      by: Chitra Banerjee Divakaruni
    - title: The Bhagavad Gita
      by: chapters 2 and 6, again
    - title: The Mahabharata
      by: the Yaksha's questions, mostly
  questions:
    - "Can a machine reason about a world it never had to describe?"
    - "If it can, how would we know what it was thinking?"
    - "Is a picture a thought, or just the memory of one?"
