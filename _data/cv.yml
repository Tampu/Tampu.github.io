      - company: Phoenix Group
        position: Data Scientist
        location: Edinburgh, UK
        start_date: 2022-01
        end_date: 2025-01
        highlights:
          - Developed an XGBoost churn model over 4.5M customers, achieving 72% Precision@1000 for top-1K retention targeting.
          - Implemented an Azure-based speech analytics workflow for QA (ASR, speaker ID, summarization, sentiment) integrated with customer/policy data, shrinking call handling from 30+ minutes to seconds and enabling faster dissatisfaction triage.
          - Built K-means based customer segmentation to surface high-likelihood pension consolidation candidates; enabled targeted decisioning outreach that drove £1.9M in incremental pension cash flow over a 6-month observation period.

