    Experience:
      - company: CoRAL, Arizona State University
        position: Graduate Researcher
        location: Tempe, AZ
        start_date: 2025-04
        end_date: present
        highlights:
          - Developing an RL post-training method for evidence-grounded diagram reasoning, combining LoRA SFT and GRPO on InternVL3.5-8B across 6 diagram QA datasets, with grounding-aware rewards evaluated on DRAGON.
          - Co-led DRAGON, a benchmark of 11,664 diagram QA instances with region-level evidence annotations; showed that even Claude Opus 4.6 reaches only 23.8% grounding IoU on AI2D. Co-developed DIAGRAMS for attribution review.
          - Built SentryLine, a QA system tracking stale evidence across evolving oncology guidelines; outperformed ASCO's production assistant on all 4 question types in ASCOBench (405 clinician-annotated conversations), with 77.1% vs. 10.0% on reasoning.
          - Reformulated stuttering detection as continuous causal onset forecasting; built a 2,872 event onset-aligned corpus and trained a causal Conformer over Whisper that anticipates 58.6% of events at a 25% alarm duty cycle.
          - Co-authored QUIETT and CAPTR on robust and multimodal table reasoning.

